# Pre-commit gate for Sovereign AP Autopilot: Python and web lint/format, secret
# scanning, large-file guard and the header check.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (apx/ factory/ evals/ attacks/)
        entry: uv run python -m mypy
        language: system
        pass_filenames: false
        types: [python]

      - id: eslint
        name: eslint (web/)
        entry: bash -c 'cd web && pnpm exec eslint .'
        language: system
        files: ^web/.*\.(ts|tsx|js|mjs)$
        pass_filenames: false

      - id: prettier
        name: prettier --check (web/)
        entry: bash -c 'cd web && pnpm exec prettier --check .'
        language: system
        files: ^web/
        pass_filenames: false

      - id: check_headers
        name: check file headers
        entry: uv run python scripts/check_headers.py --all
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # pre-commit-hooks v5.0.0 (pinned in the uv dev group) run through `uv run python -m`, not the
  # upstream repo's pip-installed .exe shims, which Windows Smart App Control blocks (WinError 4551).
  - repo: local
    hooks:
      - id: check-added-large-files
        name: check for added large files
        entry: uv run python -m pre_commit_hooks.check_added_large_files
        language: system
        args: [--maxkb=1024]
        stages: [pre-commit, pre-push, manual]
        # web/public/pdfjs/pdf.worker.min.mjs is pdfjs-dist's own pre-minified worker build,
        # vendored so the pdf.js viewer never depends on a runtime CDN fetch; it can't be made
        # smaller without breaking it.
        exclude: ^web/public/pdfjs/
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
        exclude: ^web/public/pdfjs/
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
        exclude: ^web/public/pdfjs/
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: uv run python -m pre_commit_hooks.check_merge_conflict
        language: system
        types: [text]
      - id: check-yaml
        name: check yaml
        entry: uv run python -m pre_commit_hooks.check_yaml
        language: system
        args: [--allow-multiple-documents]
        types: [yaml]
      - id: check-toml
        name: check toml
        entry: uv run python -m pre_commit_hooks.check_toml
        language: system
        types: [toml]
      - id: check-json
        name: check json
        entry: uv run python -m pre_commit_hooks.check_json
        language: system
        types: [json]
