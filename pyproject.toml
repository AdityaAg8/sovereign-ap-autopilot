# uv project for Sovereign AP Autopilot: Python 3.12 runtime (apx/, factory/, evals/, ml/,
# attacks/) plus ruff, mypy, pytest and coverage configuration (PRD §8).

[project]
name = "sovereign-ap-autopilot"
version = "0.0.1"
description = "Local-only AP agent: UAE PINT AE e-invoicing with fraud checks, a provable field error rate and injection-proof payments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "pillow>=11.0",
    "lxml>=6.1.3",
    "saxonche>=13.0.0",
    "jinja2>=3.1.6",
    "faker>=40.39.0",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "scikit-learn>=1.8.0",
    "pypdfium2>=5.13.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "temporalio>=1.33.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "python-multipart>=0.0.32",
    "pyjwt>=2.14.0",
    "argon2-cffi>=25.1.0",
    "watchfiles>=1.3.0",
    "imagehash>=4.3.2",
    "mcp>=2.2.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "sse-starlette>=3.4.11",
    "playwright>=1.63.0",
    "augraphy>=8.2.6",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "hypothesis>=6.115",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "huggingface-hub>=0.26",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "datasets>=5.0.1",
    "docile-benchmark>=0.3.5",
    "agentdojo==0.1.35",
    "reportlab>=5.0.1",
    "tokenizers>=0.23",  # CPU test of the Extractor B loss mask (tests/unit/ml/test_mask_tokenizer.py)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apx"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apx", "factory", "evals", "ml", "attacks", "tests", "scripts"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["apx", "factory", "evals", "ml", "attacks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apx", "factory", "evals", "db", "attacks", "ml", "tools"]
exclude = ["^web/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pypdfium2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy and scikit-learn ship no py.typed marker / stubs (ADR-0006 addendum); apx.trust wraps
# every call site with typed signatures, so untyped imports do not leak Any into the rest of apx.
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The Extractor B trainer stack exists only in the trainer image (ADR-0011, design §1); the
# torch-importing modules load it lazily, and jsonschema ships no stubs in this environment.
module = ["torch.*", "transformers.*", "trl.*", "unsloth.*", "mlflow.*", "peft.*", "jsonschema.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "gpu: needs a GPU and local models; excluded from CI (run with `make test-gpu`)",
    "integration: needs a live `make up` Docker Compose stack; excluded from CI (run locally)",
    "artifacts: needs pinned PINT AE/SchXslt bundles fetched by `python -m evals.pint_ae.fetch`",
    "external: needs local data that CI never has: an external dataset/framework clone under data/external or the generated factory split under data/uae (PRD C5)",
    "perf: wall-clock performance budgets; run on an idle target host (`pytest -m perf`), not in CI",
    "trainer: needs the Extractor B trainer image (torch/transformers/TRL); CPU only (`make test-trainer`)",
]
addopts = "-m 'not gpu and not integration and not artifacts and not external and not perf and not trainer' --cov=apx --cov-branch --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["apx"]

[tool.coverage.report]
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.uv]
# Windows Smart App Control blocks native DLLs without reputation (ADR-0006 addendum);
# pin to builds already trusted on the dev host. CI (Linux) is unaffected by these pins.
constraint-dependencies = ["numpy==2.4.4", "scipy==1.17.1", "pandas==3.0.2", "scikit-learn==1.8.0", "pyarrow==23.0.1"]
