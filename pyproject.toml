# uv project for Sovereign AP Autopilot: Python 3.12 runtime (apx/, factory/, evals/, ml/,
# attacks/) plus ruff, mypy, pytest and coverage configuration (PRD §8).

[project]
name = "sovereign-ap-autopilot"
version = "0.0.1"
description = "Local-only AP agent: UAE PINT AE e-invoicing with fraud checks, a provable field error rate and injection-proof payments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "hypothesis>=6.115",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "huggingface-hub>=0.26",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apx"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apx", "factory", "evals", "ml", "attacks", "tests", "scripts"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["apx", "factory", "evals", "ml", "attacks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apx", "factory", "evals"]
exclude = ["^web/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "gpu: needs a GPU and local models; excluded from CI (run with `make test-gpu`)",
]
addopts = "-m 'not gpu' --cov=apx --cov-branch --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["apx"]

[tool.coverage.report]
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
