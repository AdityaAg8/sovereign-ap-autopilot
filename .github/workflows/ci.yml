# CI gate for Sovereign AP Autopilot: Python lint/types/unit tests, web lint/types/build,
# the header check and a secret scan, run on every PR and push to main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: Install Playwright Chromium headless shell (factory renders invoices to PDF)
        run: uv run playwright install --with-deps --only-shell chromium

      - name: pytest (unit; default selection excludes gpu, integration, artifacts, external, perf)
        run: uv run pytest

      - name: fetch pinned PINT AE/SchXslt bundles
        run: uv run python -m evals.pint_ae.fetch

      # Appends to the unit step's coverage data: the 85% bar is checked on all the
      # tests CI ran, never on this 35-test slice alone.
      - name: "pytest (artifacts: pinned PINT AE/SchXslt bundles)"
        run: uv run pytest -m artifacts --cov-append

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: build
        run: pnpm build

  headers:
    name: headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Check PRD §8 file headers
        run: uv run python scripts/check_headers.py --all

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        # Official CLI image over the full history; needs no API token or license.
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.24.3
          git /repo --redact --verbose --exit-code 1
