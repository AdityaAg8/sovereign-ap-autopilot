# llama-swap config for the extract/arbitrate stages (PRD §4, §10 M0.4): one group per
# pipeline stage so only the models a stage needs are resident on the single RTX 4080
#12 GB at once (PRD C2). Model files are the exact ones pinned in infra/models.lock.json,
# mounted read-only at /models by infra/compose.yaml -- llama-swap never fetches from the
# network here (that already happened on the host via `make models`).
#
# Extraction-call policy (PRD §4 rule) -- thinking disabled, temperature <= 0.2, fixed
# seed, JSON-schema output and logprobs -- is applied per request by apx/llm, not baked
# into these startup flags (chat-template kwargs and response_format are request fields).

# 300s, not llama-swap's 120s default: the arbiter GGUF + mmproj (~6.7 GB combined) cold-load
# from `models/`, a bind mount from the Windows host's NTFS filesystem (ADR-0006's addendum
# calls out slower bind-mount I/O than a native Linux volume), measured 60-120s+ run to run --
# a 120s ceiling intermittently failed with "health check timed out after 2m0s".
healthCheckTimeout: 300
logLevel: info
# Upstream llama-server output too (slot counts, context errors) -- the evidence ADR-0013 used.
logToStdout: both

macros:
  # Flags verified against `llama-server --help` in the pinned image (infra/compose.yaml's
  # llama-swap digest comment) after the v93-cuda-b4879 -> v257-cuda-b11096 bump: `--flash-attn`
  # now takes a value instead of being a bare boolean, and `--no-mmap` was replaced by
  # `--load-mode` (`none` is the equivalent of the old `--no-mmap`).
  "llama-server": >
    /app/llama-server
    --host 0.0.0.0
    --port ${PORT}
    --gpu-layers 999
    --flash-attn on
    --jinja
    --load-mode none
    --seed 42
    --temp 0.2

models:
  extractor-a:
    name: "Extractor A (Qwen3.5-9B)"
    description: "PRD §4: extraction, exception agent and ops chat (extract/agent stages)."
    # 2 slots of 12288 tokens (3 crashed under load). Prompt caching is off: Qwen3.5 is a hybrid
    # recurrent model and partial prefix reuse across slots killed llama-server; every invoice
    # prompt is unique, so the cache bought nothing anyway.
    # ADR-0013 (measured 2026-09-23, 5-page invoices): prompt max 7226 tokens + completion max
    # 2712 = 9938 < 12288 per slot. Resident ~6.35 GB alone (weights dominate: q8_0 KV, image
    # token caps and -ub 256 each moved the total by < 0.2 GB, within desktop noise).
    # --parallel must equal WORKER_EXTRACTOR_A_SLOTS (apx.workflows.main).
    cmd: |
      ${llama-server}
      --model /models/unsloth/Qwen3.5-9B-GGUF/Qwen3.5-9B-UD-Q4_K_XL.gguf
      --mmproj /models/unsloth/Qwen3.5-9B-GGUF/mmproj-F16.gguf
      --ctx-size 24576
      --parallel 2
      --no-cache-prompt
      --cache-ram 0
    aliases: ["exception-agent", "ops-chat"]
    checkEndpoint: /health
    ttl: 600

  extractor-b:
    name: "Extractor B (Qwen3.5-4B + LoRA)"
    description: "PRD §4: extraction stage, our LoRA lands in M3.2 as a --lora flag."
    # ADR-0013: an explicit --parallel is required. Unset, this llama.cpp build picks 4 slots
    # sharing ONE unified 8192-token cache (n_slots=4, kv_unified=true), so concurrent 3-page
    # prompts overflowed it ("Context size has been exceeded", "failed to process mtmd chunk").
    # Now 2 slots of 8192 each: prompt max 3105 (3 images at SERVING_RUNG L0) + completion max
    # 2227 = 5332. Resident ~4.1 GB alone. --parallel must equal WORKER_EXTRACTOR_B_SLOTS.
    cmd: |
      ${llama-server}
      --model /models/unsloth/Qwen3.5-4B-GGUF/Qwen3.5-4B-Q4_K_M.gguf
      --mmproj /models/unsloth/Qwen3.5-4B-GGUF/mmproj-F16.gguf
      --ctx-size 16384
      --parallel 2
    checkEndpoint: /health
    ttl: 600

  extractor-b-challenger:
    name: "Extractor B challenger (fine-tuned, not served)"
    description: "ADR-0009 §1.7-1.8: the exported Q4_K_M of run b-20260923T2025-eb0aea7d for the export smoke and the P1-P5 gate runs. Not a runtime alias (apx.llm.client), so the pipeline never calls it; promotion is a separate, gated change to extractor-b."
    # Same flags as extractor-b so gate measurements compare like with like. The mmproj is the
    # exported one, which `make export-b` proved tensor-equal to the upstream mmproj-F16.gguf.
    cmd: |
      ${llama-server}
      --model /models/extractor_b/b-20260923T2025-eb0aea7d/export/extractor-b-Q4_K_M.gguf
      --mmproj /models/extractor_b/b-20260923T2025-eb0aea7d/export/mmproj-F16.gguf
      --ctx-size 16384
      --parallel 2
    checkEndpoint: /health
    ttl: 600

  arbiter:
    name: "Arbiter (Gemma 4 12B QAT)"
    description: "PRD §4: arbitrates when Extractor A and B disagree."
    cmd: |
      ${llama-server}
      --model /models/google/gemma-4-12B-it-qat-q4_0-gguf/gemma-4-12b-it-qat-q4_0.gguf
      --mmproj /models/google/gemma-4-12B-it-qat-q4_0-gguf/mmproj-gemma-4-12b-it-qat-q4_0.gguf
      --ctx-size 8192
    checkEndpoint: /health
    ttl: 600

  redteam-uncensored:
    name: "Red-team agent (Qwen3.5-9B uncensored)"
    description: "PRD §4: offline only (M6.3/M9.5 stock-vs-uncensored agent comparison), never in the runtime pipeline."
    cmd: |
      ${llama-server}
      --model /models/HauhauCS/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
      --ctx-size 12288
      --no-cache-prompt
      --cache-ram 0
    checkEndpoint: /health
    ttl: 600

  # M3.4 bake-off (PRD §4 offline table, §10 M3.4): offline challengers of extractor-a, never
  # runtime aliases (apx.llm.client RUNTIME_MODEL_ALIASES), called only by `evals.bakeoff`. Each
  # runs one slot of 12288 tokens, the same per-slot context extractor-a gives one invoice, since
  # the bake-off is sequential. `make bakeoff-probe` measures each one before any eval hours.
  bakeoff-q38-27b:
    name: "Bake-off: Qwen3.8-27B UD-IQ2_XXS + mmproj"
    description: "M3.4 challenger, text + page images like extractor-a. Offline only."
    cmd: |
      ${llama-server}
      --model /models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ2_XXS.gguf
      --mmproj /models/unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf
      --ctx-size 12288
      --parallel 1
      --no-cache-prompt
      --cache-ram 0
    checkEndpoint: /health
    ttl: 600

  bakeoff-q38-9b-distill:
    name: "Bake-off: empero-ai Qwen3.8-9B-Distill Q4_K_M"
    description: "M3.4 challenger, text + parse only (the repo ships no mmproj). Offline only."
    cmd: |
      ${llama-server}
      --model /models/empero-ai/Qwen3.8-9B-Distill-GGUF/Qwen3.8-9B-Q4_K_M.gguf
      --ctx-size 12288
      --parallel 1
      --no-cache-prompt
      --cache-ram 0
    checkEndpoint: /health
    ttl: 600

  bakeoff-q35-9b-mtp:
    name: "Bake-off latency arm: Qwen3.5-9B UD-Q4_K_XL + MTP speculative decoding"
    description: "M3.4 latency arm: extractor-a's quant with its MTP head drafting 3 tokens. Offline only."
    # `--spec-type draft-mtp` is listed by `llama-server --help` in the pinned b11096 image; the
    # probe establishes whether it serves together with --mmproj (the report records either way).
    cmd: |
      ${llama-server}
      --model /models/unsloth/Qwen3.5-9B-MTP-GGUF/Qwen3.5-9B-UD-Q4_K_XL.gguf
      --mmproj /models/unsloth/Qwen3.5-9B-MTP-GGUF/mmproj-F16.gguf
      --ctx-size 12288
      --parallel 1
      --no-cache-prompt
      --cache-ram 0
      --spec-type draft-mtp
      --spec-draft-n-max 3
    checkEndpoint: /health
    ttl: 600

# Groups map onto pipeline stages (PRD §3). ADR-0013: A and B together measured 10.3-10.6 GB
# resident (peak 11.74-11.84 GB whole-card with a 1.1-1.4 GB desktop), which cannot hold the
# 11.8 GB budget once the desktop takes its usual ~2.3 GB. So the extract group swaps: only one
# of A/B is ever loaded (peak = A ~6.6 GB + desktop), and the worker's GpuStageScheduler batches
# calls per model so llama-swap swaps per batch, not per request. Arbitrate evicts it likewise.
# concurrencyLimit stays at llama-swap's default (10, then an immediate 429): the worker keeps
# its own in-flight calls at the slot counts (apx.llm.slots), so 429 now only means a foreign
# caller (ops chat, an eval) is saturating a model, and the client backs off on it.
routing:
  router:
    use: group
    settings:
      groups:
        extract:
          swap: true
          exclusive: true
          members: [extractor-a, extractor-b, extractor-b-challenger]
        arbitrate:
          swap: true
          exclusive: true
          members: [arbiter]
        redteam:
          swap: true
          exclusive: true
          members: [redteam-uncensored]
        # M3.4: one challenger at a time, and loading one evicts every other group (extract
        # included), so no challenger ever co-resides with extractor-a or another challenger.
        bakeoff:
          swap: true
          exclusive: true
          members: [bakeoff-q38-27b, bakeoff-q38-9b-distill, bakeoff-q35-9b-mtp]
