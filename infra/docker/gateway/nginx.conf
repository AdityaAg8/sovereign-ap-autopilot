# Static reverse-proxy config for the `gateway` service (PRD §2 C1, §10 M0.4; docs/adr/0001
# amendment): the only container on both `app` and `edge`, so it is the sole way a host tool
# or browser reaches llama-swap/Phoenix/MLflow/the apx API. Runs no application code -- every
# location below is a plain proxy_pass, nothing is parsed, templated or executed here. Postgres
# and the Temporal Web UI are deliberately absent: they are only reachable
# through the opt-in `devports` service and its own config (nginx.devports.conf).

worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    /dev/stdout;
    error_log     /dev/stderr warn;

    # Docker's embedded DNS (used for service-name lookups on the `app` network). Resolving
    # per-request (via the $upstream_* variables below) instead of once at startup means a
    # restarted upstream (for example `make gpu-free` / `make up` cycling llama-swap) gets a
    # fresh IP without a gateway reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Self-contained healthcheck: proves nginx itself is serving, independent of whether any
    # proxied service is currently reachable. Not published to the host.
    server {
        listen 8888;
        location /healthz {
            return 200 "ok\n";
        }
    }

    # llama-swap: OpenAI-compatible API for the extract/arbitrate stages (infra/llama-swap.yaml).
    # The runtime calls llama-swap directly; this port serves the host-run evals, which must
    # accept every request the runtime sends. Page images travel as base64 JSON: nginx's default
    # 1 MB body cap rejected (413) eval requests with two dense 1024-px pages. 25m covers B's
    # three pages and A's two with a wide margin.
    server {
        listen 8080;
        location / {
            set $upstream http://llama-swap:8080;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            client_max_body_size 25m;
        }
    }

    # Arize Phoenix: trace UI + OTLP/HTTP ingest.
    server {
        listen 6006;
        location / {
            set $upstream http://phoenix:6006;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # MLflow: model registry UI/API.
    server {
        listen 5000;
        location / {
            set $upstream http://mlflow:5000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # apx/api (FastAPI): REST for the web app, plus the SSE live feed and assistant chat,
    # so responses stream unbuffered and long-lived streams are not cut at the default 60s.
    server {
        listen 8000;
        location / {
            set $upstream http://api:8000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            client_max_body_size 25m;
        }
    }

    # parse (PaddleOCR-VL) for the host-run GPU evals only (make bakeoff, cal-rows-*,
    # extraction-a-*; docs/adr/0001 amendment 2). The runtime still calls it over `app`.
    # Page images arrive as base64 JSON, and a cold model load plus a dense page can take
    # longer than the default 60s.
    server {
        listen 8010;
        location / {
            set $upstream http://parse:8000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
            client_max_body_size 64m;
        }
    }

    # Placeholder for web/ (Next.js), which runs on the host (`pnpm dev`/`pnpm start`) for now.
    # server {
    #     listen 3000;
    #     location / {
    #         set $upstream http://web:3000;
    #         proxy_pass $upstream;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #     }
    # }
}
