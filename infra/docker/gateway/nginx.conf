# Static reverse-proxy config for the `gateway` service (PRD §2 C1, §10 M0.4; docs/adr/0001
# amendment): the only container on both `app` and `edge`, so it is the sole way a host tool
# or browser reaches llama-swap/Phoenix/MLflow/Temporal. Runs no application code -- every
# location below is a plain proxy_pass, nothing is parsed, templated or executed here.

worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    # Docker's embedded DNS, resolved per-connection via the $upstream variable below so a
    # restarted postgres container doesn't need a gateway reload -- same reasoning as the
    # `resolver` in the `http` block.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Postgres wire protocol is not HTTP, so it gets a raw TCP passthrough rather than an
    # `http` location: local dev tools (psql, a DB GUI) only, never the internet.
    server {
        listen 5432;
        set $upstream postgres:5432;
        proxy_pass $upstream;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    /dev/stdout;
    error_log     /dev/stderr warn;

    # Docker's embedded DNS (used for service-name lookups on the `app` network). Resolving
    # per-request (via the $upstream_* variables below) instead of once at startup means a
    # restarted upstream (for example `make gpu-free` / `make up` cycling llama-swap) gets a
    # fresh IP without a gateway reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Self-contained healthcheck: proves nginx itself is serving, independent of whether any
    # proxied service is currently reachable. Not published to the host.
    server {
        listen 8888;
        location /healthz {
            return 200 "ok\n";
        }
    }

    # llama-swap: OpenAI-compatible API for the extract/arbitrate stages (infra/llama-swap.yaml).
    server {
        listen 8080;
        location / {
            set $upstream http://llama-swap:8080;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }

    # Arize Phoenix: trace UI + OTLP/HTTP ingest.
    server {
        listen 6006;
        location / {
            set $upstream http://phoenix:6006;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # MLflow: model registry UI/API.
    server {
        listen 5000;
        location / {
            set $upstream http://mlflow:5000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # Temporal Web UI (the gRPC frontend on 7233 is for in-network clients only -- api/worker,
    # once M5 adds them -- and is intentionally not proxied here).
    server {
        listen 8233;
        location / {
            set $upstream http://temporal:8233;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # apx/api (FastAPI, M5.3): REST for the web app, plus the SSE live feed and assistant chat,
    # so responses stream unbuffered and long-lived streams are not cut at the default 60s.
    server {
        listen 8000;
        location / {
            set $upstream http://api:8000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            client_max_body_size 25m;
        }
    }

    # Placeholder for web/ (Next.js), which runs on the host (`pnpm dev`/`pnpm start`) for now.
    # server {
    #     listen 3000;
    #     location / {
    #         set $upstream http://web:3000;
    #         proxy_pass $upstream;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #     }
    # }
}
