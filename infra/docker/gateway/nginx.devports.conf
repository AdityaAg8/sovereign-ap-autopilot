# Static config for the opt-in `devports` service (infra/compose.yaml, profile `devports`;
# REVIEW C-02/C-03): host dev-tool access to Postgres (raw TCP on 5432) and a read-only view of
# the Temporal Web UI (8233). Never loaded by the default `gateway`; runs no application code.

worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

stream {
    # Docker's embedded DNS, resolved per connection so a restarted postgres needs no reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Postgres wire protocol: local dev tools (psql, a DB GUI, host-run `make eval-attacks`).
    # Still password-authenticated with the generated POSTGRES_PASSWORD from `.env`.
    server {
        listen 5432;
        set $upstream postgres:5432;
        proxy_pass $upstream;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    error_log     /dev/stderr warn;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8888;
        location /healthz {
            return 200 "ok\n";
        }
    }

    # Temporal Web UI, read-only. The dev server's embedded UI has no auth and no switch for
    # write actions, and a `review` signal sent from it would bypass the review API's approval
    # checks. Enforcement is the method limit: signal, reset, terminate, cancel,
    # start and batch operations are all POSTs, so only GET/HEAD reach the UI server. The
    # settings rewrite below only hides the now-refused buttons.
    server {
        listen 8233;

        location = /api/v1/settings {
            limit_except GET {
                deny all;
            }
            set $upstream http://temporal:8233;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter '"DisableWriteActions":false' '"DisableWriteActions":true';
            sub_filter '"WorkflowSignalDisabled":false' '"WorkflowSignalDisabled":true';
            sub_filter '"WorkflowResetDisabled":false' '"WorkflowResetDisabled":true';
            sub_filter '"WorkflowTerminateDisabled":false' '"WorkflowTerminateDisabled":true';
            sub_filter '"WorkflowCancelDisabled":false' '"WorkflowCancelDisabled":true';
            sub_filter '"BatchActionsDisabled":false' '"BatchActionsDisabled":true';
            sub_filter '"StartWorkflowDisabled":false' '"StartWorkflowDisabled":true';
        }

        location / {
            limit_except GET {
                deny all;
            }
            set $upstream http://temporal:8233;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
