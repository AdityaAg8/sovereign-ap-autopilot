# Local Docker Compose stack for Sovereign AP Autopilot (PRD §3 cross-cutting, §10 M0.4):
# Postgres+pgvector, a Temporal dev server, Arize Phoenix, MLflow, llama-swap/CUDA, the parse
# placeholder, the `gateway` reverse proxy and the opt-in `toolbox` dev container. Every
# runtime service sits on the `app` network, which has no egress (PRD C1) -- model download
# (scripts/download_models.py, `make models`) runs on the host, never through this file or
# the `app` network. `app` is `internal: true`, so Docker does not publish ports for anything
# on it (verified empirically, not just in theory -- see docs/adr/0001's amendment): `gateway`
# is the one container that also joins `edge` and is the only way a host tool or browser
# reaches these services.
name: sovereign-ap-autopilot

networks:
  # Runtime services only. `internal: true` means containers on this network cannot reach
  # the internet (PRD C1's automated test proves that) -- and, as a side effect, Docker never
  # sets up host port publishing for a container whose only network is internal. `gateway` is
  # the sole container that bridges this to the host, via `edge` below.
  app:
    internal: true
  # Host-reachable side of `gateway` only (PRD §10 M0.4, docs/adr/0001 amendment). No other
  # service joins this network; `gateway` proxies into `app` and runs no application code.
  edge:
    internal: false
  # Not attached to any service started by `make up`. Reserved for the optional
  # containerized model-fetch path below (profile "tools"), kept off the runtime network.
  egress:
    internal: false

volumes:
  postgres-data:
  phoenix-data:
  mlflow-data:

services:
  postgres:
    image: pgvector/pgvector:pg16-trixie
    restart: unless-stopped
    environment:
      # Local dev-only defaults, never used outside 127.0.0.1 -- set POSTGRES_USER/PASSWORD/DB
      # in `.env` (see .env.example) to override.
      POSTGRES_USER: ${POSTGRES_USER:-apx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apx-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-apx}
    # No `ports:` here (see the network comment above): reachable from the host through
    # `gateway`'s TCP passthrough on 127.0.0.1:5432 (infra/docker/gateway/nginx.conf's
    # `stream` block), for local dev tools (psql, a DB GUI) -- never the internet.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal:
    # Bundles the `temporal` CLI's ephemeral dev server (in-memory SQLite, frontend gRPC
    # on 7233, Web UI on 8233) -- PRD §3 calls for "Temporal dev server", not a production
    # cluster with its own Postgres schema.
    image: temporalio/temporal:1.9.1
    restart: unless-stopped
    entrypoint: ["temporal"]
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233", "--ui-port", "8233"]
    # No `ports:` here: `app` is internal, so a direct publish never worked (see the network
    # comment above). The Web UI (8233) is reachable from the host through `gateway`; the
    # gRPC frontend (7233) is for in-network clients only (the `api` and `worker` services).
    networks: [app]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  phoenix:
    image: arizephoenix/phoenix:20.15.0
    restart: unless-stopped
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    # No `ports:` here (see the network comment above): the UI + OTLP/HTTP port (6006) is
    # reachable from the host through `gateway`; OTLP/gRPC (4317) is for in-network clients.
    volumes:
      - phoenix-data:/mnt/data
    networks: [app]
    healthcheck:
      # Official image is distroless (no shell/curl/wget): use its own venv's python.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:6006/healthz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.7.0
    restart: unless-stopped
    working_dir: /mlflow
    entrypoint: ["mlflow"]
    command:
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      # MLflow 3.7 rejects unknown Host headers (DNS-rebinding guard; default is localhost and
      # private IPs only). Compose clients (trainer, worker) reach it as `mlflow:5000`.
      - --allowed-hosts
      - "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
      - --serve-artifacts
    # No `ports:` here (see the network comment above): reachable from the host through
    # `gateway` instead.
    volumes:
      - mlflow-data:/mlflow
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  llama-swap:
    # CUDA build; models/ is downloaded and checksum-verified on the host by `make models`
    # (never inside this network) and mounted read-only. See infra/llama-swap.yaml.
    # Pinned by digest (PRD §10 M0.5's "next verified build" rule): v93-cuda-b4879 (llama.cpp
    # b4879, ~early 2025) predates the Qwen3.5/Gemma-4 architectures §4 pins, and failed every
    # chat-completions request with "unable to start process: can not start(), upstream proxy
    # missing". Re-resolved 2026-09-22 to the newest tagged CUDA build, v257-cuda-b11096 (same
    # digest as the floating `cuda` tag then); re-run `make smoke` before bumping this further.
    image: ghcr.io/mostlygeek/llama-swap@sha256:a6f3a605d29695112945a577f53d7e1f0888e3421e1ceba897cea971c1d6f2c1
    restart: unless-stopped
    command: ["-config", "/config/llama-swap.yaml", "-listen", ":8080"]
    # No `ports:` here (see the network comment above): reachable from the host through
    # `gateway`; `toolbox` (M0.5 `make smoke`) reaches it directly over `app` by service name.
    volumes:
      - ./llama-swap.yaml:/config/llama-swap.yaml:ro
      - ../models:/models:ro
    networks: [app]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Image ships no curl/wget; probe the OpenAI models endpoint over bash /dev/tcp.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /v1/models HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  parse:
    # Real PaddleOCR-VL-1.6 GPU service (PRD §3, §4, §10 M3.1), replacing the M0.4 placeholder.
    # Serves the scan path only: born-digital PDFs are parsed host-side by apx.parse.digital
    # (pdfplumber), so the ≥98% IoU gate never depends on this container being up. GPU memory
    # is capped in-process (PADDLE_GPU_MEM_FRACTION, default 0.35 of the card, ~4.3 GB on 12 GB
    # -- comfortably above the ~3.2 GB peak reports/smoke.md measured) rather than here, since
    # only the process itself can bound its own CUDA allocator.
    build:
      context: ./docker/parse
    restart: unless-stopped
    environment:
      PADDLE_GPU_MEM_FRACTION: ${PADDLE_GPU_MEM_FRACTION:-0.35}
    volumes:
      # Same read-only model mount pattern as llama-swap; only the one checkpoint this
      # service needs, not the whole models/ tree.
      - ../models/PaddlePaddle/PaddleOCR-VL-1.6:/models/PaddleOCR-VL-1.6:ro
    # No `ports:` here (see the network comment above): parse is called by the ingest
    # pipeline (api/worker, once M5 adds them) over `app`, not by host tools or a browser,
    # so it isn't added to `gateway` either.
    networks: [app]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  gateway:
    # Static nginx reverse proxy (PRD §2 C1, §10 M0.4; docs/adr/0001 amendment): the only
    # container on both `app` and `edge`, so it is the only way a host tool or browser
    # reaches llama-swap/Phoenix/MLflow/Temporal. Runs no application code -- config is a
    # read-only bind mount, never baked in or templated. Add a proxied port here, never a
    # new host-published port on another service.
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080" # llama-swap
      - "127.0.0.1:6006:6006" # Phoenix UI + OTLP/HTTP
      - "127.0.0.1:5000:5000" # MLflow
      - "127.0.0.1:8233:8233" # Temporal Web UI
      - "127.0.0.1:5432:5432" # Postgres (TCP passthrough, `stream` block -- dev tools only)
      - "127.0.0.1:8000:8000" # apx API (REST + SSE) for the web app
    networks: [app, edge]
    depends_on:
      llama-swap:
        condition: service_healthy
      phoenix:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # apx application services (PRD §10 M5.6), one image: the REST/SSE API and the invoice
  # worker (Temporal activities + inbox watcher). Both stay on `app`, so every model, OCR and
  # database call is in-network; the host reaches the API only through `gateway`. `data/` is
  # shared so an upload stored by the API is the same file the worker reads. `migrate` is the
  # one-shot schema upgrade both wait for.
  migrate:
    build: &apx-build
      context: ..
      dockerfile: infra/docker/apx/Dockerfile
    image: sovereign-ap-autopilot/apx:local
    command: ["alembic", "upgrade", "head"]
    environment: &apx-env
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-apx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apx-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-apx}
      AGENT_DATABASE_URL: postgresql+asyncpg://apx_agent_ro:apx-agent-ro-dev-only@postgres:5432/${POSTGRES_DB:-apx}
      API_JWT_SECRET: ${API_JWT_SECRET:-}
      API_TEMPORAL_ADDRESS: temporal:7233
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000}
      WORKER_TEMPORAL_ADDRESS: temporal:7233
      LLM_BASE_URL: http://llama-swap:8080
      PARSE_BASE_URL: http://parse:8000
      # The operator's own buyer master data (never read off a supplier invoice): PINT AE
      # ibr-144-ae needs the buyer's address/emirate and ibr-136-ae its trade license. Defaults
      # are the synthetic buyer every factory invoice is addressed to (factory/layouts.py).
      WORKER_BUYER_ADDRESS: ${WORKER_BUYER_ADDRESS:-Warehouse 12, Al Quoz Industrial Area 3, Dubai, United Arab Emirates, P.O. Box 45210}
      WORKER_BUYER_TRADE_LICENSE: ${WORKER_BUYER_TRADE_LICENSE:-1045821}
      # Our own TRN, written as the e-invoice buyer (ADR-0012 amendment 2); matches factory/layouts.py BUYER_TRN.
      WORKER_BUYER_TRN: ${WORKER_BUYER_TRN:-100234567800003}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      # Docker Desktop bind mounts do not deliver inotify events from the host filesystem.
      WATCHFILES_FORCE_POLLING: "true"
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *apx-build
    image: sovereign-ap-autopilot/apx:local
    restart: unless-stopped
    command: ["uvicorn", "apx.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment: *apx-env
    volumes: &apx-volumes
      - ../data:/app/data
    networks: [app]
    depends_on: &apx-deps
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    build: *apx-build
    image: sovereign-ap-autopilot/apx:local
    restart: unless-stopped
    command: ["python", "-m", "apx.workflows.main"]
    environment: *apx-env
    volumes: *apx-volumes
    networks: [app]
    deploy:
      resources:
        reservations:
          devices:
            # M5.6a preflight: nvidia-smi/NVML only (free VRAM before a stage switch), no compute.
            - driver: nvidia
              count: all
              capabilities: [utility]
    depends_on:
      <<: *apx-deps
      api:
        condition: service_healthy

  toolbox:
    # Linux Python 3.12 + uv + CUDA torch/transformers environment for `make smoke`, evals
    # and training (PRD §10 M0.4/M0.5; docs/adr/0006 addendum): the Windows host blocks
    # native DLLs from these wheels under Smart App Control, so this work runs in Docker
    # instead. Opt-in only (`--profile dev`); never started by `make up`. Repo mounted
    # read-write for `reports/`; `models/` mounted read-only, same as llama-swap.
    profiles: [dev]
    build:
      context: ./docker/toolbox
    volumes:
      - ..:/repo
      - ../models:/repo/models:ro
    working_dir: /repo
    networks: [app]
    depends_on:
      llama-swap:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  trainer:
    # Extractor B fine-tune (ADR-0009 §1.5, ADR-0011; docs/design/training-loop.md). Opt-in
    # only (`--profile train`), never started by `make up`; run through `make train-b*`, which
    # runs `make gpu-free` first. On `app` only, which is internal, so it has no egress; it
    # reaches mlflow by name. The repo, data/ and models/ are read-only except the run
    # directory (models/extractor_b) and data/ml (prepared rows, quarantine, gpu.lock).
    profiles: [train]
    image: sovereign-ap/trainer:2026.9.11
    build:
      context: ..
      dockerfile: infra/docker/trainer/Dockerfile
    stop_grace_period: 180s
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      EXTRACTOR_B_BASE_PATH: ${EXTRACTOR_B_BASE_PATH:-}
      EXTRACTOR_B_BASE_REVISION: ${EXTRACTOR_B_BASE_REVISION:-}
      EXTRACTOR_B_EVAL_BATCH: ${EXTRACTOR_B_EVAL_BATCH:-}  # dev-eval generate batch; blank = 8
      TRAINER_IMAGE_DIGEST: ${TRAINER_IMAGE_DIGEST:-}
      GIT_SHA: ${GIT_SHA:-unknown}
    volumes:
      - ..:/repo:ro
      - ../data:/repo/data:ro
      - ../data/ml:/repo/data/ml
      - ../models:/repo/models:ro
      - ../models/extractor_b:/repo/models/extractor_b
    working_dir: /repo
    networks: [app]
    depends_on:
      mlflow:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional containerized alternative to running scripts/download_models.py on the host
  # (e.g. a CI runner without uv). Not started by `make up`/`docker compose up` -- only by
  # `docker compose --profile tools run model-fetch`. Lives on `egress`, never `app`.
  model-fetch:
    profiles: [tools]
    build:
      context: ..
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /repo
        RUN pip install --no-cache-dir huggingface_hub>=0.26 pyyaml>=6.0
        COPY scripts/resolve_models.py scripts/download_models.py /repo/scripts/
        COPY infra/models.yaml /repo/infra/models.yaml
        ENTRYPOINT ["python", "scripts/download_models.py"]
    networks: [egress]
    volumes:
      - ../models:/repo/models
      - ../infra:/repo/infra
