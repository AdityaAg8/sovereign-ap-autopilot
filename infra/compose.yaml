# Local Docker Compose stack for Sovereign AP Autopilot (PRD §3 cross-cutting, §10 M0.4):
# Postgres+pgvector, a Temporal dev server, Arize Phoenix, MLflow, llama-swap/CUDA, the parse
# placeholder, the `gateway` reverse proxy and the opt-in `toolbox` dev container. Every
# runtime service sits on the `app` network, which has no egress (PRD C1) -- model download
# (scripts/download_models.py, `make models`) runs on the host, never through this file or
# the `app` network. `app` is `internal: true`, so Docker does not publish ports for anything
# on it (verified empirically, not just in theory -- see docs/adr/0001's amendment): `gateway`
# is the one container that also joins `edge` and is the only way a host tool or browser
# reaches these services.
name: sovereign-ap-autopilot

networks:
  # Runtime services only. `internal: true` means containers on this network cannot reach
  # the internet (PRD C1's automated test proves that) -- and, as a side effect, Docker never
  # sets up host port publishing for a container whose only network is internal. `gateway` is
  # the sole container that bridges this to the host, via `edge` below.
  app:
    internal: true
  # Host-reachable side of `gateway` only (PRD §10 M0.4, docs/adr/0001 amendment). No other
  # service joins this network; `gateway` proxies into `app` and runs no application code.
  edge:
    internal: false
  # Not attached to any service started by `make up`. Reserved for the optional
  # containerized model-fetch path below (profile "tools"), kept off the runtime network.
  egress:
    internal: false

volumes:
  postgres-data:
  phoenix-data:
  mlflow-data:

services:
  postgres:
    image: pgvector/pgvector:pg16-trixie
    restart: unless-stopped
    environment:
      # Local dev-only defaults, never used outside 127.0.0.1 -- set POSTGRES_USER/PASSWORD/DB
      # in `.env` (see .env.example) to override.
      POSTGRES_USER: ${POSTGRES_USER:-apx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apx-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-apx}
    # No `ports:` here (see the network comment above): reachable from the host through
    # `gateway`'s TCP passthrough on 127.0.0.1:5432 (infra/docker/gateway/nginx.conf's
    # `stream` block), for local dev tools (psql, a DB GUI) -- never the internet.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal:
    # Bundles the `temporal` CLI's ephemeral dev server (in-memory SQLite, frontend gRPC
    # on 7233, Web UI on 8233) -- PRD §3 calls for "Temporal dev server", not a production
    # cluster with its own Postgres schema.
    image: temporalio/temporal:1.9.1
    restart: unless-stopped
    entrypoint: ["temporal"]
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233", "--ui-port", "8233"]
    # No `ports:` here: `app` is internal, so a direct publish never worked (see the network
    # comment above). The Web UI (8233) is reachable from the host through `gateway`; the
    # gRPC frontend (7233) is for in-network clients only (api/worker, once M5 adds them).
    networks: [app]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  phoenix:
    image: arizephoenix/phoenix:20.15.0
    restart: unless-stopped
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    # No `ports:` here (see the network comment above): the UI + OTLP/HTTP port (6006) is
    # reachable from the host through `gateway`; OTLP/gRPC (4317) is for in-network clients.
    volumes:
      - phoenix-data:/mnt/data
    networks: [app]
    healthcheck:
      # Official image is distroless (no shell/curl/wget): use its own venv's python.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:6006/healthz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.7.0
    restart: unless-stopped
    working_dir: /mlflow
    entrypoint: ["mlflow"]
    command:
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
    # No `ports:` here (see the network comment above): reachable from the host through
    # `gateway` instead.
    volumes:
      - mlflow-data:/mlflow
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  llama-swap:
    # CUDA build; models/ is downloaded and checksum-verified on the host by `make models`
    # (never inside this network) and mounted read-only. See infra/llama-swap.yaml.
    # Pinned by digest (PRD §10 M0.5's "next verified build" rule): v93-cuda-b4879 (llama.cpp
    # b4879, ~early 2025) predates the Qwen3.5/Gemma-4 architectures §4 pins, and failed every
    # chat-completions request with "unable to start process: can not start(), upstream proxy
    # missing". Re-resolved 2026-09-22 to the newest tagged CUDA build, v257-cuda-b11096 (same
    # digest as the floating `cuda` tag then); re-run `make smoke` before bumping this further.
    image: ghcr.io/mostlygeek/llama-swap@sha256:a6f3a605d29695112945a577f53d7e1f0888e3421e1ceba897cea971c1d6f2c1
    restart: unless-stopped
    command: ["-config", "/config/llama-swap.yaml", "-listen", ":8080"]
    # No `ports:` here (see the network comment above): reachable from the host through
    # `gateway`; `toolbox` (M0.5 `make smoke`) reaches it directly over `app` by service name.
    volumes:
      - ./llama-swap.yaml:/config/llama-swap.yaml:ro
      - ../models:/models:ro
    networks: [app]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Image ships no curl/wget; probe the OpenAI models endpoint over bash /dev/tcp.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /v1/models HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  parse:
    # Placeholder for apx/parse (PRD §10 M0.4 note: "real service in M3.1"). Swap this
    # build for the PaddleOCR 3.x GPU container once M3.1 lands; keep the GPU memory cap
    # (e.g. PADDLE_GPU_MEM_FRACTION) on that image, not here, since this stub loads no model.
    build:
      context: ./docker/parse-placeholder
    restart: unless-stopped
    # No `ports:` here (see the network comment above): parse is called by the ingest
    # pipeline (api/worker, once M5 adds them) over `app`, not by host tools or a browser,
    # so it isn't added to `gateway` either.
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  gateway:
    # Static nginx reverse proxy (PRD §2 C1, §10 M0.4; docs/adr/0001 amendment): the only
    # container on both `app` and `edge`, so it is the only way a host tool or browser
    # reaches llama-swap/Phoenix/MLflow/Temporal. Runs no application code -- config is a
    # read-only bind mount, never baked in or templated. Add a proxied port here, never a
    # new host-published port on another service.
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080" # llama-swap
      - "127.0.0.1:6006:6006" # Phoenix UI + OTLP/HTTP
      - "127.0.0.1:5000:5000" # MLflow
      - "127.0.0.1:8233:8233" # Temporal Web UI
      - "127.0.0.1:5432:5432" # Postgres (TCP passthrough, `stream` block -- dev tools only)
    networks: [app, edge]
    depends_on:
      llama-swap:
        condition: service_healthy
      phoenix:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  toolbox:
    # Linux Python 3.12 + uv + CUDA torch/transformers environment for `make smoke`, evals
    # and training (PRD §10 M0.4/M0.5; docs/adr/0006 addendum): the Windows host blocks
    # native DLLs from these wheels under Smart App Control, so this work runs in Docker
    # instead. Opt-in only (`--profile dev`); never started by `make up`. Repo mounted
    # read-write for `reports/`; `models/` mounted read-only, same as llama-swap.
    profiles: [dev]
    build:
      context: ./docker/toolbox
    volumes:
      - ..:/repo
      - ../models:/repo/models:ro
    working_dir: /repo
    networks: [app]
    depends_on:
      llama-swap:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional containerized alternative to running scripts/download_models.py on the host
  # (e.g. a CI runner without uv). Not started by `make up`/`docker compose up` -- only by
  # `docker compose --profile tools run model-fetch`. Lives on `egress`, never `app`.
  model-fetch:
    profiles: [tools]
    build:
      context: ..
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /repo
        RUN pip install --no-cache-dir huggingface_hub>=0.26 pyyaml>=6.0
        COPY scripts/resolve_models.py scripts/download_models.py /repo/scripts/
        COPY infra/models.yaml /repo/infra/models.yaml
        ENTRYPOINT ["python", "scripts/download_models.py"]
    networks: [egress]
    volumes:
      - ../models:/repo/models
      - ../infra:/repo/infra
